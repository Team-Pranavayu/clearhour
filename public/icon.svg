<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ClearHour: a saffron morning sun with clock hands, rising behind a white lotus (India's national flower). -->
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <g transform="translate(32 32) scale(0.88) translate(-32 -32)">
    <!-- sun rays -->
    <g stroke="#ffb562" stroke-width="2.2" stroke-linecap="round">
      <line x1="32" y1="5" x2="32" y2="9"/>
      <line x1="18.5" y1="9.5" x2="20.5" y2="13"/>
      <line x1="45.5" y1="9.5" x2="43.5" y2="13"/>
      <line x1="8.5" y1="19" x2="12" y2="21"/>
      <line x1="55.5" y1="19" x2="52" y2="21"/>
    </g>
    <!-- sun with clock hands -->
    <circle cx="32" cy="27" r="13" fill="#ff9933"/>
    <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
      <line x1="32" y1="27" x2="32" y2="18.5"/>
      <line x1="32" y1="27" x2="37.5" y2="30"/>
    </g>
    <circle cx="32" cy="27" r="2" fill="#ffffff"/>
    <!-- lotus -->
    <g fill="#ffffff" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round">
      <path d="M32 54 C20 56 10 51 7 44 C16 41.5 26 46 32 54 Z"/>
      <path d="M32 54 C44 56 54 51 57 44 C48 41.5 38 46 32 54 Z"/>
      <path d="M32 54 C22 51 16 44 16 37 C24 38.5 30 45 32 54 Z"/>
      <path d="M32 54 C42 51 48 44 48 37 C40 38.5 34 45 32 54 Z"/>
      <path d="M32 54 C25.5 48 25 39.5 32 33 C39 39.5 38.5 48 32 54 Z"/>
    </g>
    <!-- water line -->
    <path d="M13 58.5 H51" stroke="#9fd8cf" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
